          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/drawable"
          cat > "proyecto/app/src/main/res/drawable/degrade_arriba.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
