          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/layout"
          cat > "proyecto/app/src/main/res/layout/activity_main.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/fondo">

              <ImageView
                  android:id="@+id/fondo"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:importantForAccessibility="no"
                  android:scaleType="centerCrop" />

              <View
                  android:layout_width="match_parent"
                  android:layout_height="160dp"
                  android:layout_alignParentTop="true"
                  android:background="@drawable/degrade_arriba" />

              <View
                  android:layout_width="match_parent"
                  android:layout_height="240dp"
                  android:layout_alignParentBottom="true"
                  android:background="@drawable/degrade_abajo" />

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentTop="true"
                  android:layout_alignParentLeft="true"
                  android:orientation="vertical"
                  android:padding="28dp">

                  <TextView
                      android:id="@+id/saludo"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:text="@string/pregunta"
                      android:textColor="@color/texto_suave"
                      android:textSize="15sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentTop="true"
                  android:layout_alignParentRight="true"
                  android:gravity="right"
                  android:orientation="vertical"
                  android:padding="28dp">

                  <TextClock
                      android:id="@+id/reloj"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:format12Hour="HH:mm"
                      android:format24Hour="HH:mm"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextClock
                      android:id="@+id/fecha"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:format12Hour="EEEE d 'de' MMMM"
                      android:format24Hour="EEEE d 'de' MMMM"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="@color/texto_suave"
                      android:textSize="13sp" />

                  <TextView
                      android:id="@+id/wifi"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="@color/texto_suave"
                      android:textSize="13sp" />

                  <TextView
                      android:id="@+id/ram"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="@color/texto_suave"
                      android:textSize="13sp" />
              </LinearLayout>

              <HorizontalScrollView
                  android:id="@+id/scroll"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:clipChildren="false"
                  android:clipToPadding="false"
                  android:fillViewport="true"
                  android:overScrollMode="never"
                  android:paddingTop="28dp"
                  android:paddingBottom="32dp"
                  android:scrollbars="none">

                  <LinearLayout
                      android:id="@+id/fila"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:clipChildren="false"
                      android:clipToPadding="false"
                      android:gravity="center"
                      android:orientation="horizontal"
                      android:paddingLeft="24dp"
                      android:paddingRight="24dp" />
              </HorizontalScrollView>
          </RelativeLayout>
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/layout"
          cat > "proyecto/app/src/main/res/layout/item_app.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="104dp"
              android:layout_height="wrap_content"
              android:layout_margin="10dp"
              android:background="@drawable/fondo_foco"
              android:clickable="true"
              android:focusable="true"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="10dp">

              <ImageView
                  android:id="@+id/icono"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:importantForAccessibility="no"
                  android:scaleType="fitCenter" />

              <TextView
                  android:id="@+id/nombre"
