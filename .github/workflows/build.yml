                      android:format12Hour="EEEE d 'de' MMMM"
                      android:format24Hour="EEEE d 'de' MMMM"
                      android:shadowColor="#000000"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="@color/texto_suave"
                      android:textSize="13sp" />

                  <TextView
                      android:id="@+id/wifi"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:shadowColor="#000000"
