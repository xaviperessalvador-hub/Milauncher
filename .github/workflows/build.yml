name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Crear proyecto
        run: |
          mkdir -p "proyecto/app"
          cat > "proyecto/app/build.gradle" <<'FIN_DEL_ARCHIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mi.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mi.launcher"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main"
          cat > "proyecto/app/src/main/AndroidManifest.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />
              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/java/com/mi/launcher"
          cat > "proyecto/app/src/main/java/com/mi/launcher/MainActivity.java" <<'FIN_DEL_ARCHIVO'
          package com.mi.launcher;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.wifi.WifiInfo;
          import android.net.wifi.WifiManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              // Cambia aqui tu nombre
              private static final String NOMBRE = "Jhonatan";

              private static final String PREFS = "launcher";
              private static final String CLAVE_OCULTAS = "ocultas";

              private static class App {
                  String nombre;
                  String paquete;
                  String clase;
                  ResolveInfo info;
              }

              private LinearLayout fila;
              private TextView wifi;
              private TextView ram;
              private TextView saludo;
              private ImageView fondo;
              private String firma = "";
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable actualizar = new Runnable() {
                  @Override
                  public void run() {
                      actualizarWifi();
                      actualizarRam();
                      actualizarSaludo();
                      handler.postDelayed(this, 30000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  fila = (LinearLayout) findViewById(R.id.fila);
                  wifi = (TextView) findViewById(R.id.wifi);
                  ram = (TextView) findViewById(R.id.ram);
                  saludo = (TextView) findViewById(R.id.saludo);
                  fondo = (ImageView) findViewById(R.id.fondo);
                  cargarFondo();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  cargarApps();
                  handler.removeCallbacks(actualizar);
                  handler.post(actualizar);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(actualizar);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // Al pulsar el boton Home, volver al primer icono
                  if (fila.getChildCount() > 0) {
                      fila.getChildAt(0).requestFocus();
                  }
              }

              @Override
              public void onBackPressed() {
                  // El launcher no se cierra con Atras
              }

              // ---------- Apps ocultas ----------

              private Set<String> leerOcultas() {
                  SharedPreferences sp = getSharedPreferences(PREFS, MODE_PRIVATE);
                  return new HashSet<String>(sp.getStringSet(CLAVE_OCULTAS, new HashSet<String>()));
              }

              private void guardarOcultas(Set<String> ocultas) {
                  getSharedPreferences(PREFS, MODE_PRIVATE)
                          .edit()
                          .putStringSet(CLAVE_OCULTAS, ocultas)
                          .apply();
              }

              private void ocultarApp(App app) {
                  Set<String> ocultas = leerOcultas();
                  ocultas.add(app.paquete);
                  guardarOcultas(ocultas);
                  Toast.makeText(this, app.nombre + " oculta", Toast.LENGTH_SHORT).show();
                  cargarApps();
              }

              private void mostrarOcultas() {
                  guardarOcultas(new HashSet<String>());
                  cargarApps();
              }

              // ---------- Fondo ----------

              // Carga la foto de fondo (res/raw/fondo) reducida al tamano de la pantalla.
              // Si no hay foto, se queda el fondo oscuro.
              private void cargarFondo() {
                  final int ancho = getResources().getDisplayMetrics().widthPixels;
                  final int alto = getResources().getDisplayMetrics().heightPixels;
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              int id = getResources().getIdentifier("fondo", "raw", getPackageName());
                              if (id == 0) return;

                              BitmapFactory.Options opciones = new BitmapFactory.Options();
                              opciones.inJustDecodeBounds = true;
                              InputStream in = getResources().openRawResource(id);
                              BitmapFactory.decodeStream(in, null, opciones);
                              in.close();

                              int muestra = 1;
                              while ((opciones.outWidth / (muestra * 2)) >= ancho
                                      && (opciones.outHeight / (muestra * 2)) >= alto) {
                                  muestra *= 2;
                              }

                              opciones.inJustDecodeBounds = false;
                              opciones.inSampleSize = muestra;
                              opciones.inPreferredConfig = Bitmap.Config.RGB_565;
                              in = getResources().openRawResource(id);
                              final Bitmap imagen = BitmapFactory.decodeStream(in, null, opciones);
                              in.close();

                              if (imagen != null) {
                                  runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          fondo.setImageBitmap(imagen);
                                      }
                                  });
                              }
                          } catch (Throwable e) {
                              // si falla, se queda el fondo oscuro
                          }
                      }
                  }).start();
              }

              // ---------- Lista de apps ----------

              // Solo apps instaladas por el usuario (o sistema que el usuario actualizo).
              private boolean esAppDelUsuario(ApplicationInfo ai) {
                  if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) == 0) return true;
                  return (ai.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0;
              }

              private void cargarApps() {
                  PackageManager pm = getPackageManager();
                  Set<String> ocultas = leerOcultas();
                  Set<String> vistos = new HashSet<String>();
                  List<App> apps = new ArrayList<App>();
                  int cuentaOcultas = 0;
                  String[] categorias = {
                          Intent.CATEGORY_LAUNCHER,
                          Intent.CATEGORY_LEANBACK_LAUNCHER
                  };

                  for (String categoria : categorias) {
                      Intent intent = new Intent(Intent.ACTION_MAIN);
                      intent.addCategory(categoria);
                      List<ResolveInfo> lista = pm.queryIntentActivities(intent, 0);
                      for (ResolveInfo ri : lista) {
                          String paquete = ri.activityInfo.packageName;
                          if (paquete.equals(getPackageName())) continue;
                          if (!esAppDelUsuario(ri.activityInfo.applicationInfo)) continue;
                          if (!vistos.add(paquete)) continue;
                          if (ocultas.contains(paquete)) {
                              cuentaOcultas++;
                              continue;
                          }
                          App app = new App();
                          app.nombre = String.valueOf(ri.loadLabel(pm));
                          app.paquete = paquete;
                          app.clase = ri.activityInfo.name;
                          app.info = ri;
                          apps.add(app);
                      }
                  }

                  Collections.sort(apps, new Comparator<App>() {
                      @Override
                      public int compare(App a, App b) {
                          return a.nombre.compareToIgnoreCase(b.nombre);
                      }
                  });

                  StringBuilder sb = new StringBuilder();
                  for (App app : apps) {
                      sb.append(app.paquete).append('/').append(app.clase).append(';');
                  }
                  sb.append('#').append(cuentaOcultas);
                  String nuevaFirma = sb.toString();
                  if (nuevaFirma.equals(firma) && fila.getChildCount() > 0) {
                      return; // nada cambio, no reconstruir
                  }
                  firma = nuevaFirma;

                  fila.removeAllViews();
                  LayoutInflater inflater = LayoutInflater.from(this);
                  for (final App app : apps) {
                      View item = inflater.inflate(R.layout.item_app, fila, false);
                      ImageView icono = (ImageView) item.findViewById(R.id.icono);
                      TextView nombre = (TextView) item.findViewById(R.id.nombre);
                      icono.setImageDrawable(app.info.loadIcon(pm));
                      nombre.setText(app.nombre);
                      item.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              abrir(app);
                          }
                      });
                      // Mantener pulsado OK = ocultar la app
                      item.setOnLongClickListener(new View.OnLongClickListener() {
                          @Override
                          public boolean onLongClick(View v) {
                              ocultarApp(app);
                              return true;
                          }
                      });
                      ponerFoco(item, nombre);
                      fila.addView(item);
                  }

                  // Atajos fijos al final de la fila: WiFi y Ajustes
                  agregarAtajo(inflater, R.drawable.ic_wifi, "WiFi",
                          new String[]{android.provider.Settings.ACTION_WIFI_SETTINGS,
                                  android.provider.Settings.ACTION_WIRELESS_SETTINGS,
                                  android.provider.Settings.ACTION_SETTINGS});
                  agregarAtajo(inflater, R.drawable.ic_ajustes, "Ajustes",
                          new String[]{android.provider.Settings.ACTION_SETTINGS});

                  // Si hay apps ocultas, se agrega un boton al final para volver a mostrarlas
                  if (cuentaOcultas > 0) {
                      View item = inflater.inflate(R.layout.item_app, fila, false);
                      ImageView icono = (ImageView) item.findViewById(R.id.icono);
                      TextView nombre = (TextView) item.findViewById(R.id.nombre);
                      icono.setImageResource(android.R.drawable.ic_menu_revert);
                      nombre.setText("Mostrar ocultas (" + cuentaOcultas + ")");
                      item.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              mostrarOcultas();
                          }
                      });
                      ponerFoco(item, nombre);
                      fila.addView(item);
                  }

                  if (fila.getChildCount() > 0) {
                      fila.getChildAt(0).requestFocus();
                  }
              }

              // Boton que abre una pantalla de Ajustes. Prueba las acciones en orden hasta que una funcione.
              private void agregarAtajo(LayoutInflater inflater, int iconoRes, String texto,
                                        final String[] acciones) {
                  View item = inflater.inflate(R.layout.item_app, fila, false);
                  ImageView icono = (ImageView) item.findViewById(R.id.icono);
                  TextView nombre = (TextView) item.findViewById(R.id.nombre);
                  icono.setImageResource(iconoRes);
                  nombre.setText(texto);
                  item.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          for (String accion : acciones) {
                              try {
                                  Intent intent = new Intent(accion);
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(intent);
                                  return;
                              } catch (Exception e) {
                                  // probar la siguiente
                              }
                          }
                      }
                  });
                  ponerFoco(item, nombre);
                  fila.addView(item);
              }

              // Al seleccionar: el icono se agranda y aparece el nombre (sin animacion)
              private void ponerFoco(View item, final TextView nombre) {
                  item.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean tieneFoco) {
                          float escala = tieneFoco ? 1.2f : 1f;
                          v.setScaleX(escala);
                          v.setScaleY(escala);
                          nombre.setVisibility(tieneFoco ? View.VISIBLE : View.INVISIBLE);
                      }
                  });
              }

              private void abrir(App app) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_MAIN);
                      intent.addCategory(Intent.CATEGORY_LAUNCHER);
                      intent.setClassName(app.paquete, app.clase);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      startActivity(intent);
                  } catch (Exception e) {
                      // si la app no se puede abrir, no hacer nada
                  }
              }

              // ---------- Datos en pantalla ----------

              private void actualizarSaludo() {
                  int hora = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
                  String texto;
                  if (hora >= 5 && hora < 12) {
                      texto = "Buenos días";
                  } else if (hora >= 12 && hora < 19) {
                      texto = "Buenas tardes";
                  } else {
                      texto = "Buenas noches";
                  }
                  saludo.setText(texto + ", " + NOMBRE);
              }

              private void actualizarRam() {
                  try {
                      ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      am.getMemoryInfo(mi);
                      long libreMb = mi.availMem / (1024 * 1024);
                      long totalMb = mi.totalMem / (1024 * 1024);
                      ram.setText("RAM libre: " + libreMb + " MB de " + totalMb + " MB");
                  } catch (Exception e) {
                      ram.setText("");
                  }
              }

              private void actualizarWifi() {
                  String texto = "Sin WiFi";
                  try {
                      ConnectivityManager cm =
                              (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkInfo ni = cm.getActiveNetworkInfo();
                      if (ni != null && ni.isConnected()) {
                          if (ni.getType() == ConnectivityManager.TYPE_WIFI) {
                              texto = "WiFi conectado";
                              WifiManager wm = (WifiManager) getApplicationContext()
                                      .getSystemService(Context.WIFI_SERVICE);
                              WifiInfo info = wm.getConnectionInfo();
                              if (info != null && info.getSSID() != null) {
                                  String ssid = info.getSSID().replace("\"", "");
                                  if (!ssid.isEmpty() && !ssid.contains("unknown")) {
                                      texto = "WiFi: " + ssid;
                                  }
                              }
                          } else if (ni.getType() == ConnectivityManager.TYPE_ETHERNET) {
                              texto = "Ethernet";
                          }
                      }
                  } catch (Exception e) {
                      // dejar el texto por defecto
                  }
                  wifi.setText(texto);
              }
          }
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/drawable"
          cat > "proyecto/app/src/main/res/drawable/degrade_abajo.xml" <<'FIN_DEL_ARCHIVO'
