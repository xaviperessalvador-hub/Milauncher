          mkdir -p "proyecto/app/src/main/res/drawable"
          cat > "proyecto/app/src/main/res/drawable/ic_wifi.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
