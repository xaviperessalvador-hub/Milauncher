          rootProject.name = "MiLauncher"
          include ':app'
          FIN_DEL_ARCHIVO

      - name: Preparar fondo
        run: |
          for f in fondo.jpg fondo.jpeg fondo.png; do
            if [ -f "$f" ]; then
              mkdir -p proyecto/app/src/main/res/raw
              if command -v convert >/dev/null 2>&1; then
                convert "$f" -auto-orient -resize "1920x1080^" -gravity center -extent 1920x1080 -quality 85 proyecto/app/src/main/res/raw/fondo.jpg || cp "$f" "proyecto/app/src/main/res/raw/fondo.${f##*.}"
              else
                cp "$f" "proyecto/app/src/main/res/raw/fondo.${f##*.}"
              fi
              echo "Fondo agregado: $f"
              break
            fi
          done
          ls -l proyecto/app/src/main/res/raw 2>/dev/null || echo "Sin foto de fondo: se usara el azul oscuro"

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Launcher v${{ github.run_number }}
          files: launcher.apk
