                  android:layout_marginTop="8dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:maxLines="1"
                  android:shadowColor="#000000"
                  android:shadowDx="0"
                  android:shadowDy="1"
                  android:shadowRadius="4"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:visibility="invisible" />
          </LinearLayout>
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/values"
          cat > "proyecto/app/src/main/res/values/colors.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fondo">#0A0A0F</color>
              <color name="foco">#2F5DB5</color>
              <color name="texto_suave">#D0D6E4</color>
          </resources>
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/values"
          cat > "proyecto/app/src/main/res/values/strings.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Mi Launcher</string>
              <string name="pregunta">¿Qué quieres ver hoy?</string>
          </resources>
          FIN_DEL_ARCHIVO
          mkdir -p "proyecto/app/src/main/res/values"
          cat > "proyecto/app/src/main/res/values/styles.xml" <<'FIN_DEL_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/fondo</item>
                  <item name="android:statusBarColor">@color/fondo</item>
                  <item name="android:navigationBarColor">@color/fondo</item>
              </style>
          </resources>
          FIN_DEL_ARCHIVO
          cat > "proyecto/build.gradle" <<'FIN_DEL_ARCHIVO'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
